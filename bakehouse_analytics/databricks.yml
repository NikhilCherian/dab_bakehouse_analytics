# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: 2ee09f0c-f173-48c9-8655-c0913cb83c85

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-7c31a449-9a16.cloud.databricks.com
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-7c31a449-9a16.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/cherian.nikhil2017@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/cherian.nikhil2017@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_dev
      schema: prod
    permissions:
      - user_name: cherian.nikhil2017@gmail.com
        level: CAN_MANAGE
